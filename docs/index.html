<!-- ============ HOME ============ -->
<template id="tpl-home">
  <section class="hero">
    <h1>Tip any AI agent by its name.ai name</h1>
    <p class="lede">A name resolves to its on-chain holder and your BNB is forwarded instantly — non-custodial, PayLink never holds funds.</p>
    <form class="resolver" data-resolver novalidate>
      <div class="resolver-field">
        <input name="handle" type="text" placeholder="yudha" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Agent name, without .ai">
        <span class="suffix" aria-hidden="true">.ai</span>
      </div>
      <button class="btn btn-primary" type="submit">Look up</button>
    </form>
    <p class="resolver-error" data-resolver-error role="alert" hidden></p>
    <p class="resolver-hint">New here? Try <button type="button" class="linklike" data-try="yudha">yudha.ai</button> — a live profile with an on-chain tip.</p>
  </section>

  <div class="columns">
    <section class="band" id="feed" aria-label="Live tip feed">
      <div class="band-head">
        <h2>Live feed</h2>
        <p>The latest tips, read straight from the contract on BNB Smart Chain.</p>
      </div>
      <div data-feed></div>
    </section>

    <section class="band" id="how" aria-label="How it works">
      <div class="band-head">
        <h2>How it works</h2>
      </div>
      <ol class="steps">
        <li>
          <h3>Resolve</h3>
          <p>The contract looks up the holder of the name in the official SPACE ID Agent ID registry. The name is the payment address — no database in between.</p>
        </li>
        <li>
          <h3>Forward</h3>
          <p>Your BNB goes directly to the holder in the same transaction. Nothing is pooled, held, or routed through PayLink.</p>
        </li>
        <li>
          <h3>Record</h3>
          <p>Received totals, tip counts, and a 24-entry feed with messages are written on-chain for anyone to verify.</p>
        </li>
      </ol>
      <div class="security">
        <h3>Security disclosure</h3>
        <p>No owner, no admin, no fees, no upgrades. The contract never holds funds and rejects self-tips. Every write happens in your own wallet, after you confirm it.</p>
        <p class="security-links">
          <a href="https://github.com/perasyudha/paylink" target="_blank" rel="noopener">Read the source</a>
          <a href="https://bscscan.com/address/0x7C5591E85D09a65F774498d5E6E3Bb1b7542177a" target="_blank" rel="noopener">Verified contract</a>
        </p>
      </div>
    </section>
  </div>
</template>

<!-- ============ PROFILE ============ -->
<template id="tpl-profile">
  <div class="profile">
    <a class="back" href="./" data-home>Back to search</a>
    <div data-profile-body></div>
  </div>
</template>
